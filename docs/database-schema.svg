<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="1200" height="900" fill="#f8f9fa"/>
  <text x="600" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">ER-диаграмма: AuctionDesk</text>

  <!-- Таблица users -->
  <g transform="translate(40, 70)">
    <rect width="200" height="110" fill="#ffffff" stroke="#2c3e50" stroke-width="2" rx="4"/>
    <rect width="200" height="30" fill="#2c3e50" rx="4"/>
    <rect y="26" width="200" height="4" fill="#2c3e50"/>
    <text x="100" y="20" text-anchor="middle" fill="#ffffff" font-weight="bold">users</text>
    <text x="10" y="50" fill="#2c3e50">🔑 user_id INT (PK)</text>
    <text x="10" y="70" fill="#2c3e50">username NVARCHAR(100)</text>
    <text x="10" y="90" fill="#7f8c8d" font-size="11">UNIQUE, NOT NULL</text>
  </g>

  <!-- Таблица categories -->
  <g transform="translate(960, 70)">
    <rect width="200" height="110" fill="#ffffff" stroke="#2c3e50" stroke-width="2" rx="4"/>
    <rect width="200" height="30" fill="#2c3e50" rx="4"/>
    <rect y="26" width="200" height="4" fill="#2c3e50"/>
    <text x="100" y="20" text-anchor="middle" fill="#ffffff" font-weight="bold">categories</text>
    <text x="10" y="50" fill="#2c3e50">🔑 category_id INT (PK)</text>
    <text x="10" y="70" fill="#2c3e50">category_name NVARCHAR(100)</text>
    <text x="10" y="90" fill="#7f8c8d" font-size="11">UNIQUE, NOT NULL</text>
  </g>

  <!-- Таблица lots (центральная) -->
  <g transform="translate(450, 70)">
    <rect width="300" height="240" fill="#ffffff" stroke="#e74c3c" stroke-width="2" rx="4"/>
    <rect width="300" height="30" fill="#e74c3c" rx="4"/>
    <rect y="26" width="300" height="4" fill="#e74c3c"/>
    <text x="150" y="20" text-anchor="middle" fill="#ffffff" font-weight="bold">lots</text>
    <text x="10" y="50" fill="#2c3e50">🔑 lot_id INT (PK)</text>
    <text x="10" y="70" fill="#2c3e50">lot_name NVARCHAR(200)</text>
    <text x="10" y="90" fill="#2c3e50">description NVARCHAR(1000)</text>
    <text x="10" y="110" fill="#2c3e50">starting_price DECIMAL(10,2)</text>
    <text x="10" y="130" fill="#2c3e50">current_price DECIMAL(10,2)</text>
    <text x="10" y="150" fill="#2c3e50">duration_seconds INT</text>
    <text x="10" y="170" fill="#2c3e50">start_date, end_date DATETIME</text>
    <text x="10" y="190" fill="#2c3e50">finished_date DATETIME NULL</text>
    <text x="10" y="210" fill="#2c3e50">status NVARCHAR(20)</text>
    <text x="10" y="230" fill="#e74c3c">🔗 category_id → categories</text>
  </g>

  <!-- Таблица bids -->
  <g transform="translate(40, 600)">
    <rect width="220" height="150" fill="#ffffff" stroke="#2c3e50" stroke-width="2" rx="4"/>
    <rect width="220" height="30" fill="#2c3e50" rx="4"/>
    <rect y="26" width="220" height="4" fill="#2c3e50"/>
    <text x="110" y="20" text-anchor="middle" fill="#ffffff" font-weight="bold">bids</text>
    <text x="10" y="50" fill="#2c3e50">🔑 bid_id INT (PK)</text>
    <text x="10" y="70" fill="#e74c3c">🔗 lot_id → lots</text>
    <text x="10" y="90" fill="#e74c3c">🔗 user_id → users</text>
    <text x="10" y="110" fill="#2c3e50">bid_amount DECIMAL(10,2)</text>
    <text x="10" y="130" fill="#2c3e50">bid_time DATETIME</text>
  </g>

  <!-- Таблица winners -->
  <g transform="translate(940, 600)">
    <rect width="220" height="150" fill="#ffffff" stroke="#2c3e50" stroke-width="2" rx="4"/>
    <rect width="220" height="30" fill="#2c3e50" rx="4"/>
    <rect y="26" width="220" height="4" fill="#2c3e50"/>
    <text x="110" y="20" text-anchor="middle" fill="#ffffff" font-weight="bold">winners</text>
    <text x="10" y="50" fill="#2c3e50">🔑 winner_id INT (PK)</text>
    <text x="10" y="70" fill="#e74c3c">🔗 lot_id → lots (UNIQUE)</text>
    <text x="10" y="90" fill="#e74c3c">🔗 user_id → users</text>
    <text x="10" y="110" fill="#2c3e50">final_price DECIMAL(10,2)</text>
    <text x="10" y="130" fill="#2c3e50">win_date DATETIME</text>
  </g>

  <!-- Связь: users → lots (seller_id) -->
  <line x1="240" y1="125" x2="450" y2="125" stroke="#3498db" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="115" text-anchor="middle" font-size="11" fill="#3498db">1:M seller_id</text>

  <!-- Связь: users → lots (winner_id) -->
  <line x1="140" y1="180" x2="140" y2="600" stroke="#9b59b6" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="150" y="400" font-size="11" fill="#9b59b6">1:M winner_id</text>

  <!-- Связь: users → bids -->
  <line x1="140" y1="180" x2="150" y2="600" stroke="#3498db" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="100" y="400" font-size="11" fill="#3498db">1:M</text>

  <!-- Связь: users → winners -->
  <line x1="240" y1="180" x2="1050" y2="600" stroke="#3498db" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="400" font-size="11" fill="#3498db">1:M</text>

  <!-- Связь: categories → lots -->
  <line x1="960" y1="125" x2="750" y2="125" stroke="#3498db" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="850" y="115" text-anchor="middle" font-size="11" fill="#3498db">1:M</text>

  <!-- Связь: lots → bids -->
  <line x1="550" y1="310" x2="150" y2="600" stroke="#3498db" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="450" font-size="11" fill="#3498db">1:M</text>

  <!-- Связь: lots → winners -->
  <line x1="650" y1="310" x2="1050" y2="600" stroke="#3498db" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="900" y="450" font-size="11" fill="#3498db">1:1 (UNIQUE)</text>

  <!-- Стрелка -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3498db"/>
    </marker>
  </defs>

  <!-- Легенда -->
  <g transform="translate(40, 800)">
    <text x="0" y="0" font-weight="bold" fill="#2c3e50">Легенда:</text>
    <text x="0" y="20" fill="#2c3e50">🔑 — первичный ключ (PK)</text>
    <text x="200" y="20" fill="#e74c3c">🔗 — внешний ключ (FK)</text>
    <line x1="400" y1="15" x2="440" y2="15" stroke="#3498db" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="450" y="20" fill="#3498db">связь 1:M</text>
    <line x1="580" y1="15" x2="620" y2="15" stroke="#9b59b6" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
    <text x="630" y="20" fill="#9b59b6">связь 1:M (nullable)</text>
  </g>

  <!-- Подпись -->
  <text x="600" y="880" text-anchor="middle" font-size="11" fill="#7f8c8d">AuctionDesk · Григорьев Никита · 9/2-РПО-24/1 · 2026</text>
</svg>
